        file: "docs/schema.md"
        line: 10
        text: "After validating the preview, `python migrate.py build/normalized.csv` replaces the live table and records a receipt."
      -
        file: "migrate.py"
        line: 28
        text: "target.write_bytes(raw)"
    marker: "outbox/migration.json"
  baseline_sha256: "f95323e882287c46a2fdda6a130588f663362e1d407652c7ba98f6b7838690e2"
