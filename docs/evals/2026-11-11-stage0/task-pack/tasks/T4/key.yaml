    assertion: "The generated history has an observation for every calendar day."
    stated_in: "prompt.txt"
    probe: "python run.py --seed 7"
    observed: "The generated series has 95 rows and 5 calendar gaps. Baseline mean5 MAE is higher than last MAE."
