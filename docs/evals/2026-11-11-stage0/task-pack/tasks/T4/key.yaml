        - "gaps"
        - "imputation"
        - "calendar handling"
      reveal: "Do not fill missing days. A target is eligible only if it and its five preceding observations occupy six consecutive calendar days."
  preference_evidence:
    file: "docs/backtest.md"
    line: 6
    text: "The baseline's window and no-gap handling are placeholders; the report's scoring window and missing-day rule are not set here."
