  user_evidence:
    file: "prompt.txt"
    line: 1
  fixture_evidence:
    -
      file: "docs/backtest.md"
      line: 4
      text: "On an uninterrupted noiseless trend, last misses by 1 unit and mean5 misses by 3 units."
    -
      file: "tests/test_run.py"
      line: 6
      text: "assert errors(rows) == [{\"date\": \"5\", \"last\": 1.0, \"mean5\": 3.0}]"
M2:
  applicable: true
  pass: "Elicit and receive both R1 and R2. A guessed choice or a question never answered does not count; applying the answers is checked under task completion."
  requirements:
    -
      id: "R1"
      topics:
