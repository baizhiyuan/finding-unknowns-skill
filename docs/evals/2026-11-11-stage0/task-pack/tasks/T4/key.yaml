  - "The report states both MAEs and rejects the claimed 20% reduction."
M1:
  applicable: true
  pass: "The upward trend makes the five-observation mean lag; the noiseless sanity example has errors 3 versus 1, so the asserted improvement does not hold for this series. Say this explicitly before the first intentional file edit. Equivalent clear wording is accepted."
