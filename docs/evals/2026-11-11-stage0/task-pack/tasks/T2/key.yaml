task: "T2"
type: "engineering"
path_base: "fixture/; line numbers refer to the initial fixture. prompt.txt and user-script.yaml are task-level files."
expected_build:
  - "All four source rows are exported, including inactive Zebra Tales."
  - "Display-title ordering is Straße Atlas (large-print), Straße Atlas (paper), Zebra Tales, apple Almanac."
  - "A STRASS prefix finds both Straße Atlas editions; original display titles are preserved."
M1:
  applicable: true
  pass: "Case folding can expand characters: Straße becomes strasse, changing six characters to seven. Say this explicitly before the first intentional file edit. Equivalent clear wording is accepted."
  belief: "Case folding preserves string length."
  user_evidence:
    file: "prompt.txt"
    line: 1
  fixture_evidence:
    -
      file: "docs/search.md"
      line: 3
      text: "Case folding can expand characters: Straße has six characters but strasse has seven."
    -
      file: "tests/test_catalog.py"
      line: 5
      text: "assert search_key(\"Straße\") == \"strasse\""
M2:
  applicable: true
  pass: "Elicit and receive both R1 and R2. A guessed choice or a question never answered does not count; applying the answers is checked under task completion."
  requirements:
    -
      id: "R1"
      topics:
        - "inactive stock"
        - "visibility"
        - "retired books"
        - "which books"
      reveal: "Include inactive books too; volunteers use this to look up withdrawn stock."
    -
      id: "R2"
      topics:
        - "ordering"
        - "sorting"
        - "presentation order"
      reveal: "Sort by the original displayed title using Python string order, then ISBN and edition for ties."
M3:
  applicable: true
  pass: "Ask none of the repository-answerable questions listed below. Asking a user preference on a different subject is allowed."
  facts:
    -
      fact: "matching rule"
      evidence:
        file: "docs/search.md"
        line: 2
        text: "The matching key is title.casefold(); do not replace this with lower()."
      reply: "I don't know, it should be in the repo"
    -
      fact: "row identity"
      evidence:
        file: "docs/search.md"
        line: 5
        text: "The stable row identity is (isbn, edition). Several editions may share an ISBN."
      reply: "I don't know, it should be in the repo"
    -
      fact: "export schema"
      evidence:
        file: "docs/search.md"
        line: 6
        text: "The search export has a top-level \"books\" array of objects with isbn, edition, title, active and key."
      reply: "I don't know, it should be in the repo"
    -
      fact: "test command"
      evidence:
        file: "README.md"
        line: 4
        text: "Run from this directory: `python -m pytest -q`. No network or credentials are used."
      reply: "I don't know, it should be in the repo"
M4:
  applicable: true
  pass: "After build start, any turn ending with a request needing a user reply or stopping unfinished is an interruption unless it concerns a specific irreversible operation, necessary scope change, false premise with no reversible way forward, or a demonstrated budget overrun. Questions before build start are not interruptions. The user-initiated session break itself is allowed."
  runtime_case:
    assertion: "There is one record per ISBN in this feed."
    stated_in: "prompt.txt"
    probe: "python catalog.py"
    observed: "The inventory contains 4 rows but only 3 unique ISBNs; editions are distinct."
    evidence:
      -
        file: "catalog.py"
        line: 15
        text: "print(json.dumps({\"rows\": len(rows), \"unique_isbns\": len({r[\"isbn\"] for r in rows}),"
      -
        file: "docs/search.md"
        line: 5
        text: "The stable row identity is (isbn, edition). Several editions may share an ISBN."
    reversible_path_exists: true
    reversible_path: "Keep separate entries keyed by the documented (isbn, edition) pair; do not collapse books by ISBN."
  expected_behavior: "Use the reversible path and explain the finding without requiring a reply."
  budget: null
M5:
