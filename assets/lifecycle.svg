<rect x="40" y="534" width="5" height="56" rx="2.5" fill="#D97757"/>
<rect x="60" y="548" width="290" height="28" rx="14" fill="#D97757"/>
<text x="205" y="567" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">.finding-unknowns/tasks/{slug}.md</text>
<text x="370" y="567" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">The card persists across sessions; committed, so the predictions' timing is provable.</text>
