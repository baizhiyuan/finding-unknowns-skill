<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">How finding-unknowns runs</title><desc id="d">Before non-trivial changes the assistant shows the map (fu:before) and waits for your reply ("just do it" skips the wait). Then it works, stops only for a scope change, a falsified premise that changes the task or an irreversible step, and shows what moved (fu:after). The look-back runs only when you ask. Nothing is written to disk.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D97757"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#B1ADA1"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#788C5D"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern>
<linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#788C5D"/><stop offset="0.5" stop-color="#D4A27F"/><stop offset="1" stop-color="#B5442E"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="679" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="679" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C15F3C" font-weight="700" letter-spacing="1">// HOW IT RUNS</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#141413" font-weight="700">Map, your reply, then what moved</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">The always-on text runs the first three steps on every non-trivial request; the look-back runs only when you ask.</text>
<rect x="40" y="150" width="262" height="28" rx="14" fill="#F5DDD1" stroke="#D97757" stroke-width="1.2"/>
<circle cx="57" cy="160" r="4.5" fill="#D97757"/><path d="M49 172a8 7 0 0 1 16 0z" fill="#D97757"/>
<text x="74" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#141413" font-weight="700">YOU · guess in the request</text>
<path d="M171 178L171 192" stroke="#141413" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
<rect x="326" y="150" width="262" height="28" rx="14" fill="#F5DDD1" stroke="#D97757" stroke-width="1.2"/>
<circle cx="343" cy="160" r="4.5" fill="#D97757"/><path d="M335 172a8 7 0 0 1 16 0z" fill="#D97757"/>
<text x="360" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#141413" font-weight="700">YOU · reply: go, or answers</text>
<path d="M457 178L457 192" stroke="#141413" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
<rect x="612" y="150" width="262" height="28" rx="14" fill="#F5DDD1" stroke="#D97757" stroke-width="1.2"/>
<circle cx="629" cy="160" r="4.5" fill="#D97757"/><path d="M621 172a8 7 0 0 1 16 0z" fill="#D97757"/>
<text x="646" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#141413" font-weight="700">YOU · read what is not proved</text>
<path d="M743 178L743 192" stroke="#141413" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
<rect x="898" y="150" width="262" height="28" rx="14" fill="#F5DDD1" stroke="#D97757" stroke-width="1.2"/>
<circle cx="915" cy="160" r="4.5" fill="#D97757"/><path d="M907 172a8 7 0 0 1 16 0z" fill="#D97757"/>
<text x="932" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#141413" font-weight="700">YOU · ask; fu-note: any time</text>
<path d="M1029 178L1029 192" stroke="#141413" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
