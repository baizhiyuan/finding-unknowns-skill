<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">When finding-unknowns fires</title><desc id="d">Three moments around one task card: brief before the build, a quiet build, a debrief after; catch-up when you come back.</desc>
