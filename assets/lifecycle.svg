<rect x="326" y="192" width="262" height="340" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<path d="M326 204a12 12 0 0 1 12 -12h238a12 12 0 0 1 12 12v0H326z" fill="#788C5D"/>
<text x="344" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#141413" font-weight="700">WORK</text>
<text x="570" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">after your reply</text>
<path d="M590 352L610 352" stroke="#D97757" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="612" y="192" width="262" height="340" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<path d="M612 204a12 12 0 0 1 12 -12h238a12 12 0 0 1 12 12v0H612z" fill="#D97757"/>
<text x="630" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#141413" font-weight="700">AFTER</text>
<text x="856" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">after the result</text>
<text x="630" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700">fu:after</text>
<path d="M876 352L896 352" stroke="#D97757" stroke-width="2.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 4"/>
<rect x="898" y="192" width="262" height="340" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<path d="M898 204a12 12 0 0 1 12 -12h238a12 12 0 0 1 12 12v0H898z" fill="#D4A27F"/>
<text x="916" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#141413" font-weight="700">LOOK-BACK</text>
<text x="1142" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">when you ask</text>
<text x="916" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700">/fu-lookback</text>
<rect x="58" y="270" width="30" height="30" rx="6" fill="#F5DDD1"/>
<text x="73.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700" text-anchor="middle">KK</text>
<text x="98" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Relying on</text>
<text x="98" y="301" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">each with its source; ✗ if wrong</text>
<rect x="58" y="320" width="30" height="30" rx="6" fill="#F5DDD1"/>
<text x="73.0" y="340.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700" text-anchor="middle">KU</text>
<text x="98" y="333" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Open</text>
<text x="98" y="351" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">I find out, or you decide</text>
<rect x="58" y="370" width="30" height="30" rx="6" fill="#F5DDD1"/>
<text x="73.0" y="390.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700" text-anchor="middle">UK</text>
<text x="98" y="383" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">I assume you want</text>
<text x="98" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">a guess you can react to</text>
<rect x="58" y="420" width="30" height="30" rx="6" fill="#D97757"/>
<text x="73.0" y="440.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FAF9F5" font-weight="700" text-anchor="middle">UU</text>
<text x="98" y="433" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">You did not ask</text>
<text x="98" y="451" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">but it matters; at most 3</text>
<text x="58" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#C15F3C" font-weight="700">I expect …; wrong if …</text>
<text x="58" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">your expectation: quoted, or not stated</text>
<text x="344" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C15F3C" font-weight="700">Waits for your reply</text>
<text x="344" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">"go" accepts the recommendations</text>
<text x="344" y="303" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">say "just do it" to skip the wait</text>
<text x="344" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Then stops only for:</text>
<circle cx="350" cy="339" r="4" fill="#D97757"/>
<text x="362" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">a scope change</text>
<circle cx="350" cy="359" r="4" fill="#D97757"/>
<text x="362" y="364" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">a falsified premise</text>
<text x="362" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">that changes the task</text>
<circle cx="350" cy="395" r="4" fill="#D97757"/>
<text x="362" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">an irreversible step</text>
<rect x="342" y="410" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
<text x="356" y="429" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#C15F3C" font-weight="700">Irreversible step:</text>
<text x="356" y="446" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">exact command, your yes,</text>
<text x="356" y="463" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">run once, never as a check</text>
<rect x="342" y="480" width="230" height="46" rx="10" fill="#FFFFFF" stroke="#E3DFD3" stroke-width="1"/>
<text x="356" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#788C5D" font-weight="700">Everything else:</text>
<text x="356" y="516" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">proceed; report in fu:after</text>
<circle cx="636" cy="281" r="4" fill="#B1ADA1"/>
<text x="650" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Expected → found</text>
<text x="650" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">a verdict; why only on a miss</text>
<circle cx="636" cy="327" r="4" fill="#B1ADA1"/>
<text x="650" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Now known</text>
<text x="650" y="351" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">with evidence</text>
<circle cx="636" cy="373" r="4" fill="#D97757"/>
<text x="650" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C15F3C" font-weight="600">Not proved</text>
<text x="650" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">what each check leaves open</text>
<circle cx="636" cy="419" r="4" fill="#B1ADA1"/>
<text x="650" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Still unknown</text>
<text x="650" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">cheapest way to find out</text>
<circle cx="636" cy="465" r="4" fill="#B1ADA1"/>
<text x="650" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Decided for you</text>
<text x="650" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">what you did not ask for</text>
<text x="630" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B1ADA1">then the turn ends</text>
<circle cx="922" cy="281" r="4" fill="#B1ADA1"/>
<text x="936" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">This session, or 7 days</text>
<text x="936" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">of transcripts, filtered</text>
<circle cx="922" cy="327" r="4" fill="#B1ADA1"/>
<text x="936" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Quotes, never rebuilds</text>
<text x="936" y="351" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">fu: blocks and fu-note: lines</text>
<circle cx="922" cy="373" r="4" fill="#B1ADA1"/>
<text x="936" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Your pattern</text>
<text x="936" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">after 5 graded expectations</text>
<circle cx="922" cy="419" r="4" fill="#B1ADA1"/>
<text x="936" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Worth learning next</text>
<text x="936" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">one item, first step</text>
<rect x="40" y="556" width="1120" height="96" rx="10" fill="#F5DDD1" stroke="#F5DDD1" stroke-width="1"/>
<rect x="40" y="556" width="5" height="96" rx="2.5" fill="#D97757"/>
<rect x="60" y="570" width="230" height="28" rx="14" fill="#D97757"/>
<text x="175" y="589" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">THE CONVERSATION</text>
<text x="310" y="589" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">is the record. Nothing is written to disk unless you say "save".</text>
<rect x="60" y="612" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
<text x="175" y="631" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700" text-anchor="middle">TRIVIAL REQUESTS</text>
<text x="310" y="631" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">Lookups and casual talk get no block at all.</text>
</svg>
