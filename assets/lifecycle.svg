<text x="356" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">one delta line on the card</text>
<text x="356" y="488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#B1ADA1">D7 surprise: … → logs/r3</text>
