<path d="M40 204a12 12 0 0 1 12 -12h238a12 12 0 0 1 12 12v0H40z" fill="#D97757"/>
<text x="58" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#141413" font-weight="700">BEFORE</text>
<text x="284" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">before any change</text>
<text x="58" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700">fu:before</text>
