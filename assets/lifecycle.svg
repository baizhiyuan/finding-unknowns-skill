<text x="502" y="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">proceed; report in fu:after</text>
<circle cx="732" cy="281" r="4" fill="#B1ADA1"/>
<text x="746" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Expected → found</text>
<text x="746" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">a verdict; why only on a miss</text>
