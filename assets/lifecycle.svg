<text x="362" y="319" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">scope change</text>
<circle cx="350" cy="340" r="4" fill="#D97757"/>
<text x="362" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">dead premise</text>
