<text x="508" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">a falsified premise</text>
<text x="508" y="353" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">that changes the task</text>
<circle cx="496" cy="370" r="4" fill="#D97757"/>
<text x="508" y="375" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">an irreversible step</text>
