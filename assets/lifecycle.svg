<rect x="60" y="570" width="230" height="28" rx="14" fill="#D97757"/>
<text x="175" y="589" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#141413" font-weight="700" text-anchor="middle">THE CONVERSATION</text>
<text x="310" y="589" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">is the record. Nothing is written to disk unless you say "save".</text>
<rect x="60" y="612" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
<text x="175" y="631" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700" text-anchor="middle">TRIVIAL REQUESTS</text>
<text x="310" y="631" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413">Lookups and casual talk get no block at all.</text>
