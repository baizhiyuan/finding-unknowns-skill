<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-labelledby="t d">
<title id="t">How finding-unknowns runs</title><desc id="d">Before non-trivial changes the assistant shows the map (fu:before), then the turn ends: a pause until you reply. "go" accepts the recommended answers; corrections change the plan. "just do it" skips the wait: it does the reversible work on the recommended answers and lists them; only irreversible steps still wait. Then it works, stops only for a scope change, a falsified premise that changes the task or an irreversible step, which runs only after an explicit yes (a bare "go" is not one) and is never test-run, even on a copy, and shows what moved (fu:after). The look-back runs only when you ask. Nothing is written to disk unless you say "save".</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D97757"/></marker>
