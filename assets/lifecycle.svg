<text x="746" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Now known</text>
<text x="746" y="351" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">with evidence</text>
<circle cx="732" cy="373" r="4" fill="#D97757"/>
<text x="746" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C15F3C" font-weight="600">Not proved</text>
<text x="746" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">what each check leaves open</text>
<circle cx="732" cy="419" r="4" fill="#B1ADA1"/>
<text x="746" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Still unknown</text>
<text x="746" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">cheapest way to find out</text>
<circle cx="732" cy="465" r="4" fill="#B1ADA1"/>
<text x="746" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Decided for you</text>
<text x="746" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">what you did not ask for</text>
<text x="726" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">then the turn ends</text>
<circle cx="968" cy="281" r="4" fill="#B1ADA1"/>
<text x="982" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">This session, or 7 days</text>
<text x="982" y="305" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">of transcripts, filtered</text>
<circle cx="968" cy="327" r="4" fill="#B1ADA1"/>
<text x="982" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Quotes, never rebuilds</text>
<text x="982" y="351" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">fu: blocks and fu-note: lines</text>
<circle cx="968" cy="373" r="4" fill="#B1ADA1"/>
<text x="982" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Your pattern</text>
<text x="982" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">after 5 graded expectations</text>
<circle cx="968" cy="419" r="4" fill="#B1ADA1"/>
<text x="982" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Worth learning next</text>
<text x="982" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5E5D59">one item, first step</text>
