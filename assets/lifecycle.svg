<text x="290" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5E5D59">* on recommended answers,</text>
<text x="290" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5E5D59">listed; irreversible steps</text>
<text x="290" y="522" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5E5D59">wait; "go" is not a yes</text>
<text x="490" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#141413" font-weight="600">Stops only for:</text>
