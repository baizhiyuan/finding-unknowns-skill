<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-labelledby="t d">
<title id="t">Debrief</title>
<desc id="d">At /fu-debrief a fresh context that did not do the work checks integrity and grades each frozen prediction, yours first; you see evidence first, then the table, what the checks did not prove and what changes in your model.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#B1ADA1" opacity="0.28"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C877A"/></marker>
</defs>
<rect width="1200" height="556" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="1" y="1" width="1198" height="554" rx="18" fill="url(#dots)"/>
<text x="60" y="64" font-size="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413" font-weight="700">Debrief</text>
<text x="60" y="100" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">Graded by a context that did not do the work. Predictions are quoted from the frozen card, never restated.</text>
<text x="60" y="150" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413" font-weight="700">Input</text>
<text x="440" y="150" font-size="17" font-family="'JetBrains Mono', Menlo, monospace" fill="#5E7046" font-weight="700">mechanism-auditor</text>
<text x="820" y="150" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413" font-weight="700">What you see (one screen)</text>
<rect x="60" y="170" width="320" height="68" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="76" y="200" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Frozen card</text>
<text x="76" y="222" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">+ the freeze commit</text>
<rect x="60" y="252" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="76" y="282" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Artifacts: diff, logs, results</text>
<rect x="60" y="312" width="320" height="68" rx="10" fill="#F7F5EF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="76" y="342" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A">The build transcript</text>
<text x="76" y="364" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A">is not given</text>
<rect x="440" y="170" width="320" height="112" rx="10" fill="#EEF1E8" stroke="#788C5D" stroke-width="1.5"/>
<text x="456" y="200" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">1  Integrity</text>
<text x="456" y="222" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Brief vs freeze commit</text>
<text x="456" y="244" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">check files untouched</text>
<text x="456" y="266" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">unlogged deviations listed</text>
<rect x="440" y="296" width="320" height="90" rx="10" fill="#EEF1E8" stroke="#788C5D" stroke-width="1.5"/>
<text x="456" y="326" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">2  Grade each prediction,</text>
<text x="456" y="348" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">yours first: consistent · partly</text>
<text x="456" y="370" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">· inconsistent · can't tell</text>
<rect x="440" y="400" width="320" height="68" rx="10" fill="#EEF1E8" stroke="#788C5D" stroke-width="1.5"/>
<text x="456" y="430" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">3  Strongest alternative</text>
<text x="456" y="452" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">+ the cheapest check</text>
<rect x="820" y="170" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
<text x="836" y="200" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Evidence: commands → output</text>
<rect x="820" y="226" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
<text x="836" y="256" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Prediction table</text>
<rect x="820" y="282" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
<text x="836" y="312" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Did NOT prove · Not checked</text>
<rect x="820" y="338" width="320" height="68" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
<text x="836" y="368" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Model changes</text>
<text x="836" y="390" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">[shown, not confirmed]</text>
<rect x="820" y="416" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
<text x="836" y="446" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Bottom line · Needs you</text>
<path d="M382 250L436 250" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M762 250L816 250" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="60" y="506" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">The builder writes only the Mechanism, with its tier. Explanation goes where a prediction missed, yours first.</text>
<text x="60" y="532" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">Each graded line is added to your personal prediction log.</text>
</svg>
