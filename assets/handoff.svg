<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716" role="img" aria-labelledby="t d">
<title id="t">Keep the reasoning</title><desc id="d">Left: the offloading to cognitive surrender spectrum and a three-way stakes triage: cheap and reversible work is offloaded, work that lands on others but stays reversible and contained gets the compact packet, irreversible or wide-blast-radius work gets the full packet. Right: the nine-section full handoff packet, evidence first and summary last; the four marked sections (evidence, did NOT prove, not checked, summary) form the compact packet.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D97757"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#B1ADA1"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern>
<linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#788C5D"/><stop offset="0.5" stop-color="#D4A27F"/><stop offset="1" stop-color="#B5442E"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="715" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="715" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#C15F3C" letter-spacing="1">// 06 · KEEP THE REASONING</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#141413">Hand off the work, not the judgment</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">Evidence first, summary last: the packet makes thinking cheap and surrender visible.</text>
<text x="40" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" letter-spacing="1.5">THE SLIDE</text><rect x="40" y="212" width="520" height="22" rx="11" fill="url(#spec)"/><rect x="78.66666666666667" y="170" width="96" height="26" rx="13" fill="#D97757"/><text x="126.66666666666667" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#141413" text-anchor="middle">stay here</text><path d="M126.66666666666667 198V210" stroke="#D97757" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="126.66666666666667" cy="223" r="11" fill="#FAF9F5" stroke="#141413" stroke-width="3"/><text x="40.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#788C5D">offloading</text><text x="40.0" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">delegate the work,</text><text x="40.0" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">keep ownership</text><text x="213.33333333333334" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#C15F3C">deferral</text><text x="213.33333333333334" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">the output becomes</text><text x="213.33333333333334" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">the next input</text><text x="386.6666666666667" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#B5442E">cognitive surrender</text><text x="386.6666666666667" y="283" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">the output quietly becomes</text><text x="386.6666666666667" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">your own; no urge to check</text><path d="M205.33333333333334 246V306" stroke="#E3DFD3" stroke-width="1"/><path d="M378.6666666666667 246V306" stroke="#E3DFD3" stroke-width="1"/><text x="40" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" letter-spacing="1.5">STAKES TRIAGE · STEP 0</text><rect x="40" y="362" width="520" height="78" rx="12" fill="#F0EEE6" stroke="#788C5D" stroke-width="1.5" filter="url(#sh)"/><rect x="40" y="372" width="5" height="58" rx="2.5" fill="#788C5D"/><text x="64" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#141413">cheap &amp; reversible → offload</text><text x="64" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">Consequences land only on the user. Hand off fully:</text><text x="64" y="428" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">one line, &quot;Low stakes — delegated fully.&quot;</text><rect x="40" y="448" width="520" height="78" rx="12" fill="#F0EEE6" stroke="#D4A27F" stroke-width="1.5" filter="url(#sh)"/><rect x="40" y="458" width="5" height="58" rx="2.5" fill="#D4A27F"/><text x="64" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#141413">on others, contained → compact packet</text><text x="64" y="496" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">Reversible, blast radius contained. The four marked</text><text x="64" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">sections: evidence, did NOT prove, not checked, summary.</text><rect x="40" y="534" width="520" height="78" rx="12" fill="#F0EEE6" stroke="#B5442E" stroke-width="1.5" filter="url(#sh)"/><rect x="40" y="544" width="5" height="58" rx="2.5" fill="#B5442E"/><text x="64" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#141413">irreversible / wide blast radius → full packet</text><text x="64" y="582" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">Money, migrations, production, &quot;is it safe to ship&quot;.</text><text x="64" y="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">All nine sections, in the order shown.</text><text x="40" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#C15F3C">Take the handoff where being wrong is cheap;</text><text x="40" y="663" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#C15F3C">keep the reasoning where others bear the consequences.</text><text x="40" y="690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E5D59">after Addy Osmani, <tspan font-style="italic">Critical thinking when agents do the work</tspan></text><text x="620" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" letter-spacing="1.5">THE FULL PACKET · IN THIS ORDER</text><circle cx="992" cy="153.5" r="5.5" fill="#D4A27F"/><text x="1003" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E5D59">= compact packet (4 of 9)</text><rect x="620" y="176" width="540" height="51" rx="10" fill="#F5DDD1" stroke="#D97757" stroke-width="2"/><rect x="630" y="186" width="31" height="31" rx="8" fill="#D97757"/><text x="645.5" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#141413" text-anchor="middle">1</text><text x="674" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Evidence</text><text x="674" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">commands actually run + raw output, before any summary</text><rect x="1088" y="189" width="60" height="24" rx="12" fill="#D97757"/><text x="1118.0" y="205.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">FIRST</text><circle cx="600" cy="201.5" r="5.5" fill="#D4A27F"/><circle cx="600" cy="258.5" r="5.5" fill="#D4A27F"/><circle cx="600" cy="543.5" r="5.5" fill="#D4A27F"/><circle cx="600" cy="657.5" r="5.5" fill="#D4A27F"/><path d="M645.5 228v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="233" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="243" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">2</text><text x="674" y="255" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">What the checks proved / did NOT prove</text><text x="674" y="273" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">one line each per contract check</text><path d="M645.5 285v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="290" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="300" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">3</text><text x="674" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Decisions &amp; assumptions</text><text x="674" y="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">defaults, scope cut, sources summarized, with where to look</text><path d="M645.5 342v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="347" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="357" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">4</text><text x="674" y="369" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Prior vs result</text><text x="674" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">every mismatch is where to look hardest</text><path d="M645.5 399v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="404" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="414" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="435" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">5</text><text x="674" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Strongest counterargument</text><text x="674" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">what would have to be true for this to be wrong?</text><rect x="1028" y="417" width="120" height="24" rx="12" fill="#FAF9F5" stroke="#6A9BCC"/><text x="1088.0" y="433.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#6A9BCC" text-anchor="middle">fresh context</text><path d="M645.5 456v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="461" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="471" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">6</text><text x="674" y="483" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Did I miss anything?</text><text x="674" y="501" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">the fresh context's answer, verbatim-short</text><rect x="1028" y="474" width="120" height="24" rx="12" fill="#FAF9F5" stroke="#6A9BCC"/><text x="1088.0" y="490.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#6A9BCC" text-anchor="middle">fresh context</text><path d="M645.5 513v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="518" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="528" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="549" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">7</text><text x="674" y="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Not checked</text><text x="674" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">at least one thing nobody verified</text><rect x="1043" y="531" width="105" height="24" rx="12" fill="#FAF9F5" stroke="#B5442E"/><text x="1095.5" y="547.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#B5442E" text-anchor="middle">never empty</text><path d="M645.5 570v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="575" width="540" height="51" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/><rect x="630" y="585" width="31" height="31" rx="8" fill="#141413"/><text x="645.5" y="606" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FAF9F5" text-anchor="middle">8</text><text x="674" y="597" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Answerability</text><text x="674" y="615" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">would you bet on this in front of whoever maintains it?</text><path d="M645.5 627v4" stroke="#D97757" stroke-width="2"/><rect x="620" y="632" width="540" height="51" rx="10" fill="#F5DDD1" stroke="#D97757" stroke-width="2"/><rect x="630" y="642" width="31" height="31" rx="8" fill="#D97757"/><text x="645.5" y="663" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#141413" text-anchor="middle">9</text><text x="674" y="654" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">Summary</text><text x="674" y="672" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">short</text><rect x="1096" y="645" width="52" height="24" rx="12" fill="#D97757"/><text x="1122.0" y="661.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">LAST</text><text x="1160" y="703" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E5D59" text-anchor="end">Sections 5-6 need a context that did not produce the work.</text></svg>
