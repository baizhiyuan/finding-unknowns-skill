<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
<title id="t">The task card</title><desc id="d">Anatomy of a task card: header, frozen Brief, Amendments, Deltas, Model changes, Open and Debrief, with who writes each and when.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D97757"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#B1ADA1"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#788C5D"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern>
<linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#788C5D"/><stop offset="0.5" stop-color="#D4A27F"/><stop offset="1" stop-color="#B5442E"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="819" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="819" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C15F3C" font-weight="700" letter-spacing="1">// 04 · THE TASK CARD</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#141413" font-weight="700">One file, two readers</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">You and the agent read the same card. It survives sessions; the frozen Brief is never edited.</text>
<text x="40" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5E5D59" font-weight="700" letter-spacing="1.5">.finding-unknowns/tasks/{slug}.md</text>
<rect x="36" y="168" width="548" height="596" rx="14" fill="#FFFFFF" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="48" y="176" width="524" height="70" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="184" width="5" height="54" rx="2.5" fill="#B1ADA1"/>
<text x="66" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Header</text>
<text x="66" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Goal · State · Next decision that needs you</text>
<text x="66" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Last seen: D7 · Timing: commit 3f2a91c</text>
<path d="M574 211.0L618 211.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="181.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="191.0" width="5" height="40" rx="2.5" fill="#B1ADA1"/>
<text x="644" y="205.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Re-orients you</text>
<text x="644" y="227.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">/fu-catch-up shows only what changed since Last seen.</text>
<rect x="48" y="256" width="524" height="150" rx="10" fill="#FBEFEA" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="264" width="5" height="134" rx="2.5" fill="#D97757"/>
<text x="66" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#C15F3C" font-weight="700">Brief</text>
<rect x="494.8" y="265" width="65" height="24" rx="12" fill="#F5DDD1" stroke="#C15F3C" stroke-width="1.2"/>
<text x="527.4" y="281.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C15F3C" font-weight="700" text-anchor="middle">FROZEN</text>
<text x="66" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Approach: retry per batch, because …</text>
<text x="66" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">P1 (you, 70%): … · falsifier · should not change</text>
<text x="66" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">A1 (agent): … · falsifier · should not change</text>
<text x="66" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Stop-points · budget 2× the estimate</text>
<text x="66" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Contract: check | does NOT prove | lane</text>
<path d="M574 331.0L618 331.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="301.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="311.0" width="5" height="40" rx="2.5" fill="#D97757"/>
<text x="644" y="325.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Written at /fu-brief, frozen on your yes</text>
<text x="644" y="347.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Your prediction is recorded before you see the agent's.</text>
<rect x="48" y="416" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="424" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Amendments</text>
<text x="66" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">M1 11-12 premise died · why · decided-for-you</text>
<path d="M574 444.0L618 444.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="414.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="424.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="438.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Dated, append-only</text>
<text x="644" y="460.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Explains a miss; never removes a prediction.</text>
<rect x="48" y="482" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="490" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Deltas</text>
<text x="66" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">D7 surprise: key holds session id → logs/r3</text>
<path d="M574 510.0L618 510.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="480.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="490.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="504.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">One line each</text>
<text x="644" y="526.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Deviations, surprises, decisions made for you.</text>
<rect x="48" y="548" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="556" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Model changes</text>
<text x="66" y="594" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">You expected X → it is Y, because Z</text>
<path d="M574 576.0L618 576.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="546.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="556.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="570.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">What changes in your picture</text>
<text x="644" y="592.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">"shown, not confirmed" until you confirm.</text>
<rect x="48" y="614" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="622" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="638" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Open</text>
<text x="66" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">run 4 of 5 pending · keep the v1 webhook?</text>
<path d="M574 642.0L618 642.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="612.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="622.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="636.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Waiting for you</text>
<text x="644" y="658.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Decisions and runs not yet done.</text>
<rect x="48" y="680" width="524" height="74" rx="10" fill="#EEF1E8" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="688" width="5" height="58" rx="2.5" fill="#788C5D"/>
<text x="66" y="704" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#788C5D" font-weight="700">Debrief</text>
<text x="66" y="726" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">| P1 | quoted | measured | partly | why [tier] |</text>
<text x="66" y="746" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Evidence · did NOT prove · not checked</text>
<path d="M574 717.0L618 717.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="687.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="697.0" width="5" height="40" rx="2.5" fill="#788C5D"/>
<text x="644" y="711.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Graded by a fresh context</text>
<text x="644" y="733.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Yours first; evidence before the bottom line.</text>
<text x="40" y="798" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Committed by default (git add + commit --only on the card's paths); notes in logs/, the profile and the prediction log stay private.</text>
</svg>
