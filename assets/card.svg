<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="t d">
<title id="t">The task card</title><desc id="d">Anatomy of a task card: the header, frozen Brief, Amendments, the deltas rollup, Model changes, Open and Debrief, with who writes each and when.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D97757"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#B1ADA1"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#788C5D"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern>
<linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#788C5D"/><stop offset="0.5" stop-color="#D4A27F"/><stop offset="1" stop-color="#B5442E"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="909" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="909" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C15F3C" font-weight="700" letter-spacing="1">// 03 · THE TASK CARD</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#141413" font-weight="700">You and the agent work from one card</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">Nested lists with fixed keys, no tables. The frozen Brief is never edited, so no prediction is rewritten after the fact.</text>
<text x="40" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5E5D59" font-weight="700" letter-spacing="1.5">.finding-unknowns/tasks/{slug}.md</text>
<rect x="36" y="168" width="548" height="678" rx="14" fill="#FFFFFF" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="48" y="176" width="524" height="116" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="184" width="5" height="100" rx="2.5" fill="#B1ADA1"/>
<text x="66" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Header</text>
<text x="66" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Goal: … · State: building</text>
<text x="66" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Needs you: nothing</text>
<text x="66" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Mode: ship · Last seen by you: …, after D3</text>
<text x="66" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Timing: Brief frozen …, commit 1a2b3c4</text>
<path d="M574 234.0L618 234.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="204.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="214.0" width="5" height="40" rx="2.5" fill="#B1ADA1"/>
<text x="644" y="228.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Re-orients you</text>
<text x="644" y="250.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Needs you lives here once; fu freeze owns State and Timing.</text>
<rect x="48" y="302" width="524" height="160" rx="10" fill="#FBEFEA" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="310" width="5" height="144" rx="2.5" fill="#D97757"/>
<text x="66" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#C15F3C" font-weight="700">Brief</text>
<rect x="494.8" y="311" width="65" height="24" rx="12" fill="#F5DDD1" stroke="#C15F3C" stroke-width="1.2"/>
<text x="527.4" y="327.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C15F3C" font-weight="700" text-anchor="middle">FROZEN</text>
<text x="66" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Approach:</text>
<text x="66" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">  - {decision} because {why}</text>
<text x="66" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">P1 (you · medium) "{your words}"</text>
<text x="66" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">  - falsifier · should not change</text>
<text x="66" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">A1 (agent · high) "…" · Stop-points · budget</text>
<text x="66" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Irreversible: `…` · C1 check · does NOT prove · lane</text>
<path d="M574 382.0L618 382.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="352.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="362.0" width="5" height="40" rx="2.5" fill="#D97757"/>
<text x="644" y="376.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Written at /fu-brief, frozen on your yes</text>
<text x="644" y="398.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Your words, quoted; recorded before you see the agent's.</text>
<rect x="48" y="472" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="480" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Amendments</text>
<text x="66" y="518" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">M1 09:40 · after D2 · confirmed: … · why: …</text>
<path d="M574 500.0L618 500.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="470.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="480.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="494.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Dated, append-only</text>
<text x="644" y="516.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Explains a miss; never removes a prediction.</text>
<rect x="48" y="538" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="546" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="562" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Deltas</text>
<text x="66" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Latest: D3 · Rollup: at most three lines</text>
<path d="M574 566.0L618 566.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="536.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="546.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="560.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">The lines live in {slug}.deltas.md</text>
<text x="644" y="582.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Each decision made for you states its cost if wrong.</text>
<rect x="48" y="604" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="612" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Model changes</text>
<text x="66" y="650" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">- You expected X → it is Y, because Z</text>
<path d="M574 632.0L618 632.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="602.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="612.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="626.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">What changes in your picture</text>
<text x="644" y="648.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">"shown, not confirmed" until you confirm.</text>
<rect x="48" y="670" width="524" height="56" rx="10" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="678" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="66" y="694" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#141413" font-weight="700">Open</text>
<text x="66" y="716" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">- the remote-zone rate is synthetic</text>
<path d="M574 698.0L618 698.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="668.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="678.0" width="5" height="40" rx="2.5" fill="#D4A27F"/>
<text x="644" y="692.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">Waiting for you</text>
<text x="644" y="714.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Decisions and runs not yet done.</text>
<rect x="48" y="736" width="524" height="100" rx="10" fill="#EEF1E8" stroke="#E3DFD3" stroke-width="1"/>
<rect x="48" y="744" width="5" height="84" rx="2.5" fill="#788C5D"/>
<text x="66" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#788C5D" font-weight="700">Debrief</text>
<text x="66" y="782" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Evidence · P1 measured · consistent? · mechanism [tier]</text>
<text x="66" y="802" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Integrity · Did NOT prove · Not checked</text>
<text x="66" y="822" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59">Bottom line: holds · did not hold · stops at</text>
<path d="M574 786.0L618 786.0" stroke="#B1ADA1" stroke-width="1" fill="none" stroke-dasharray="3 4"/>
<rect x="624" y="756.0" width="536" height="60" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="624" y="766.0" width="5" height="40" rx="2.5" fill="#788C5D"/>
<text x="644" y="780.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#141413" font-weight="700">The completion report</text>
<text x="644" y="802.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Yours first; evidence before the bottom line.</text>
<text x="40" y="886" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">fu freeze commits the card, its deltas file and decisions.md; profile.md, the prediction log, logs/ and view/ stay local.</text>
</svg>
