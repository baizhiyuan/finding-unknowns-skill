<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-labelledby="t d">
<title id="t">四类未知</title>
<desc id="d">按用户是否知道答案、是否意识到问题划分的 2×2 矩阵，标注每类未知对应的方法与模糊度权重。</desc>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="1199" height="723" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="723" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="54" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C">// 03 · 四类未知</text>
<text x="40" y="98" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#141413">先判断属于哪类未知，再选择方法</text>
<text x="40" y="130" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5E5D59">四类未知的处理方式不同；计算模糊度时，权重也不同。</text>
<text x="405.0" y="190" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#5E5D59" text-anchor="middle">用户意识到</text>
<text x="915.0" y="190" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#5E5D59" text-anchor="middle">用户没有意识到</text>
<text x="100" y="307.0" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#5E5D59" text-anchor="middle">用户知道答案</text>
<text x="100" y="515.0" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#5E5D59" text-anchor="middle">用户不知道答案</text>
<rect x="160" y="206" width="490" height="192" rx="12" fill="#F0EEE6" stroke="#E3DFD3" filter="url(#sh)"/>
<rect x="160" y="222" width="4" height="160" rx="2" fill="#B1ADA1"/>
<rect x="184" y="228" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="214" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KK</text>
<text x="262" y="256" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#141413">已知的已知</text>
<text x="262" y="280" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5E5D59">需求中已写明的内容</text>
<text x="626" y="244" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5E5D59" text-anchor="end">权重</text>
<text x="626" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.20</text>
<path d="M184 306H626" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="184" y="336" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#141413">→ 逐条写下来</text>
<text x="184" y="364" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5E5D59">没有写下的前提，容易在执行中走样</text>
<rect x="670" y="206" width="490" height="192" rx="12" fill="#F0EEE6" stroke="#E3DFD3" filter="url(#sh)"/>
<rect x="670" y="222" width="4" height="160" rx="2" fill="#B1ADA1"/>
<rect x="694" y="228" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="724" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UK</text>
<text x="772" y="256" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#141413">未知的已知</text>
<text x="772" y="280" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5E5D59">看到才能判断的偏好</text>
<text x="1136" y="244" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5E5D59" text-anchor="end">权重</text>
<text x="1136" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.25</text>
<path d="M694 306H1136" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="694" y="336" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#141413">→ 用原型和参考实现把偏好说清楚</text>
<rect x="694" y="352" width="98" height="28" rx="14" fill="#F5DDD1"/>
<text x="743.1" y="371" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T2 方案原型</text>
<rect x="802.278125" y="352" width="98" height="28" rx="14" fill="#F5DDD1"/>
<text x="851.4" y="371" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T4 参考实现</text>
<rect x="160" y="414" width="490" height="192" rx="12" fill="#F0EEE6" stroke="#E3DFD3" filter="url(#sh)"/>
<rect x="160" y="430" width="4" height="160" rx="2" fill="#B1ADA1"/>
<rect x="184" y="436" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="214" y="475" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KU</text>
<text x="262" y="464" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#141413">已知的未知</text>
<text x="262" y="488" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5E5D59">能说出来的待定问题</text>
<text x="626" y="452" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5E5D59" text-anchor="end">权重</text>
<text x="626" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.25</text>
<path d="M184 514H626" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="184" y="544" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#141413">→ 有针对性地提问</text>
<rect x="184" y="560" width="98" height="28" rx="14" fill="#F5DDD1"/>
<text x="233.1" y="579" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T3 需求访谈</text>
<rect x="292.278125" y="560" width="98" height="28" rx="14" fill="#F5DDD1"/>
<text x="341.4" y="579" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T5 实施计划</text>
<rect x="670" y="414" width="490" height="192" rx="12" fill="#F5DDD1" stroke="#D97757" stroke-width="2.5" filter="url(#sh)"/>
<rect x="670" y="430" width="4" height="160" rx="2" fill="#D97757"/>
<rect x="694" y="436" width="60" height="60" rx="12" fill="#D97757"/>
<text x="724" y="475" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UU</text>
<text x="772" y="464" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#141413">未知的未知</text>
<text x="772" y="488" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5E5D59">没有意识到的盲区</text>
<text x="1136" y="452" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5E5D59" text-anchor="end">权重</text>
<text x="1136" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#C15F3C" text-anchor="end">.30</text>
<path d="M694 514H1136" stroke="#D97757" stroke-width="1" stroke-opacity="0.6"/>
<text x="694" y="544" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C15F3C">→ 找出没人想到要问的问题</text>
<rect x="694" y="560" width="98" height="28" rx="14" fill="#FAF9F5"/>
<text x="743.1" y="579" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T1 盲区排查</text>
<rect x="802.278125" y="560" width="98" height="28" rx="14" fill="#FAF9F5"/>
<text x="851.4" y="579" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#C15F3C" text-anchor="middle">T8 理解测验</text>
<rect x="1060" y="562" width="76" height="26" rx="13" fill="#D97757"/>
<text x="1098.0" y="580" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">权重最高</text>
<rect x="160" y="630" width="1000" height="64" rx="12" fill="#FFFFFF" stroke="#E3DFD3"/><rect x="160" y="640" width="4" height="44" rx="2" fill="#D97757"/>
<text x="184" y="668" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#C15F3C">计算公式</text>
<text x="262" y="669" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#141413">模糊度 = 1 − (KK × 0.20 + KU × 0.25 + UK × 0.25 + <tspan fill="#C15F3C" font-weight="700">UU × 0.30</tspan>)</text>
<text x="1136" y="668" font-family="Noto Sans SC, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5E5D59" text-anchor="end">每轮按类别分别评分</text>
</svg>