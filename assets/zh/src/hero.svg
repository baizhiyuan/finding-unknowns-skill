<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">finding-unknowns v5.0.0</title>
<desc id="d">每个任务一张任务卡。/brief-me：你先预测，再查清现场，智能体随后预测，你确认后冻结任务卡。安静执行：只在不可逆操作、范围变化、前提失效或预算超支时打断你，其余情况记在任务卡上。/catch-up：先回忆，再看变化。/debrief：由新上下文评判每条冻结的预测，先评你的；写明检查没有证明什么，以及你的认知需要哪些修正。</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#B1ADA1" opacity="0.28"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C877A"/></marker>
</defs>
<rect width="1200" height="500" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="1" y="1" width="1198" height="498" rx="18" fill="url(#dots)"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">
<text x="60" y="78" font-size="40" font-weight="700">finding-unknowns</text>
<text x="424" y="78" font-size="20" font-weight="600" fill="#C15F3C">v5.0.0</text>
<text x="60" y="114" font-size="19" font-family="Noto Sans SC" fill="#3D3929">每个任务一张任务卡。你先预测，智能体安静地执行；</text>
<text x="60" y="140" font-size="19" font-family="Noto Sans SC" fill="#3D3929">完成后，由未参与执行的上下文评判双方的预测。</text>
</g>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<!-- brief -->
<rect x="60" y="190" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="84" y="226" font-size="22" font-weight="700" fill="#C15F3C" font-family="'JetBrains Mono', Menlo, monospace">/brief-me</text>
<text x="84" y="258" font-size="16" fill="#141413" font-family="Noto Sans SC">你先预测</text>
<text x="84" y="284" font-size="16" fill="#141413" font-family="Noto Sans SC">查清现场，智能体再预测</text>
<text x="84" y="310" font-size="16" fill="#141413" font-family="Noto Sans SC">约定打断点与验收标准</text>
<text x="84" y="336" font-size="16" fill="#141413" font-family="Noto Sans SC">你确认后冻结并提交</text>
<!-- build -->
<rect x="450" y="190" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>
<text x="474" y="226" font-size="22" font-weight="700" fill="#5E7046" font-family="Noto Sans SC">安静执行</text>
<text x="474" y="258" font-size="16" fill="#141413" font-family="Noto Sans SC">只在以下情况打断你：</text>
<text x="474" y="284" font-size="16" fill="#141413" font-family="Noto Sans SC">· 不可逆操作　· 范围变化</text>
<text x="474" y="310" font-size="16" fill="#141413" font-family="Noto Sans SC">· 前提失效　　· 预算超支</text>
<text x="474" y="336" font-size="16" fill="#141413" font-family="Noto Sans SC">其余情况：在任务卡上记一行</text>
<!-- debrief -->
<rect x="840" y="190" width="300" height="170" rx="14" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="864" y="226" font-size="22" font-weight="700" fill="#C15F3C" font-family="'JetBrains Mono', Menlo, monospace">/debrief</text>
<text x="864" y="258" font-size="16" fill="#141413" font-family="Noto Sans SC">新上下文评判每条预测，</text>
<text x="864" y="284" font-size="16" fill="#141413" font-family="Noto Sans SC">先评你的预测</text>
<text x="864" y="310" font-size="16" fill="#141413" font-family="Noto Sans SC">写明检查没有证明什么</text>
<text x="864" y="336" font-size="16" fill="#141413" font-family="Noto Sans SC">指出你的认知需要哪些修正</text>
<path d="M362 275H446" stroke="#8C877A" stroke-width="2" marker-end="url(#arr)"/>
<path d="M752 275H836" stroke="#8C877A" stroke-width="2" marker-end="url(#arr)"/>
<!-- card + catch-up -->
<rect x="380" y="388" width="440" height="46" rx="10" fill="#F0EEE6" stroke="#B1ADA1"/>
<text x="600" y="417" font-size="16" text-anchor="middle" fill="#3D3929" font-family="'JetBrains Mono', Menlo, monospace">.finding-unknowns/tasks/{slug}.md</text>
<path d="M600 362V386" stroke="#B1ADA1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="535" y="472" font-size="16" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-weight="700" fill="#C15F3C">/catch-up</text>
<text x="545" y="472" font-size="16" font-family="Noto Sans SC" fill="#3D3929">下次会话：先回忆，再看变化</text>
</g>
</svg>
