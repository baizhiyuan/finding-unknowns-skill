<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
<title id="t">四个打断点</title>
<desc id="d">执行期间，智能体只在四种可对照任务卡核对的情况下停下来找你；其余情况记录在案，工作继续。</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#B1ADA1" opacity="0.28"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C877A"/></marker>
</defs>
<rect width="1200" height="730" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="1" y="1" width="1198" height="728" rx="18" fill="url(#dots)"/>
<text x="60" y="64" font-size="30" font-family="Noto Sans SC" fill="#141413" font-weight="700">四个打断点</text>
<text x="60" y="100" font-size="17" font-family="Noto Sans SC" fill="#3D3929">对照任务卡核对，而不是由智能体自行判断风险高低。</text>
<rect x="60" y="128" width="460" height="52" rx="10" fill="#F0EEE6" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="80" y="160" font-size="17" font-family="Noto Sans SC" fill="#141413" font-weight="600">执行中出现了一个情况</text>
<rect x="60" y="206" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="240" font-size="17" font-family="Noto Sans SC" fill="#C15F3C" font-weight="700">1  不可逆操作？</text>
<text x="80" y="268" font-size="14" font-family="Noto Sans SC" fill="#3D3929">改写或删除数据、生产环境、资金、对外发布、对他人的承诺</text>
<path d="M522 249L596 249" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="240" font-size="14" font-family="Noto Sans SC" fill="#8C877A" text-anchor="middle">是</text>
<rect x="600" y="206" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="232" font-size="15" font-family="Noto Sans SC" fill="#141413">停下。智能体准备好确切的命令，</text>
<text x="620" y="254" font-size="15" font-family="Noto Sans SC" fill="#141413">由你执行，或你同意执行这一条命令；</text>
<text x="620" y="276" font-size="15" font-family="Noto Sans SC" fill="#141413">事后检查通过后才算完成。</text>
<rect x="60" y="306" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="340" font-size="17" font-family="Noto Sans SC" fill="#C15F3C" font-weight="700">2  范围变化？</text>
<text x="80" y="368" font-size="14" font-family="Noto Sans SC" fill="#3D3929">超出简报中的做法或验收标准</text>
<path d="M522 349L596 349" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="340" font-size="14" font-family="Noto Sans SC" fill="#8C877A" text-anchor="middle">是</text>
<rect x="600" y="306" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="354" font-size="15" font-family="Noto Sans SC" fill="#141413">停下。由你决定是否改变范围。</text>
<rect x="60" y="406" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="440" font-size="17" font-family="Noto Sans SC" fill="#C15F3C" font-weight="700">3  前提失效，且没有可逆的退路？</text>
<text x="80" y="468" font-size="14" font-family="Noto Sans SC" fill="#3D3929">简报中的前提或某条预测的反证条件已触发</text>
<path d="M522 449L596 449" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="440" font-size="14" font-family="Noto Sans SC" fill="#8C877A" text-anchor="middle">是</text>
<rect x="600" y="406" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="443" font-size="15" font-family="Noto Sans SC" fill="#141413">停下。由你确认修订；</text>
<text x="620" y="465" font-size="15" font-family="Noto Sans SC" fill="#141413">原来的预测照样评判。</text>
<rect x="60" y="506" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="540" font-size="17" font-family="Noto Sans SC" fill="#C15F3C" font-weight="700">4  超出约定的预算？</text>
<text x="80" y="568" font-size="14" font-family="Noto Sans SC" fill="#3D3929">超过简报中约定的倍数</text>
<path d="M522 549L596 549" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="540" font-size="14" font-family="Noto Sans SC" fill="#8C877A" text-anchor="middle">是</text>
<rect x="600" y="506" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="554" font-size="15" font-family="Noto Sans SC" fill="#141413">停下。由你决定：继续、收缩，还是重新做简报。</text>
<path d="M290 592L290 626" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="304" y="614" font-size="14" font-family="Noto Sans SC" fill="#8C877A">四项都不是</text>
<rect x="60" y="630" width="1080" height="70" rx="10" fill="#EEF1E8" stroke="#788C5D" stroke-width="2"/>
<text x="80" y="660" font-size="17" font-family="Noto Sans SC" fill="#5E7046" font-weight="700">继续执行。</text>
<text x="80" y="684" font-size="15" font-family="Noto Sans SC" fill="#141413">选择最容易撤回的做法，并在任务卡上记一行。可以等的问题放进待办。</text>
</svg>
