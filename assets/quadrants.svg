<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">The four quadrants of unknowns</title><desc id="d">2x2 matrix of what you know or do not know, by whether you are aware of it. Each quadrant shows what the assistant does with it before the work, and the field it appears under in fu:before; fu:after reports what moved.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.08"/></filter><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#B1ADA1" opacity="0.35"/></pattern></defs>
<rect x="0.5" y="0.5" width="1199" height="699" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="0.5" y="0.5" width="1199" height="699" rx="18" fill="url(#dots)" opacity="0.5"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#C15F3C" letter-spacing="1">// THE FOUR QUADRANTS</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#141413">Keep your own map of what you know and do not know</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">fu:before shows where the unknowns are. fu:after shows what moved. Only evidence moves anything.</text>
<text x="375" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5">YOU ARE AWARE</text>
<text x="905" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5">YOU ARE NOT AWARE</text>
<text x="94" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#141413" text-anchor="middle" letter-spacing="2" transform="rotate(-90 94 291)">YOU KNOW</text>
<text x="94" y="499" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#141413" text-anchor="middle" letter-spacing="2" transform="rotate(-90 94 499)">YOU DON'T KNOW</text>
<rect x="120" y="196" width="510" height="190" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="120" y="210" width="4" height="162" rx="2" fill="#B1ADA1"/>
<rect x="144" y="218" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="174" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KK</text>
<text x="222" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Known Knowns</text>
<text x="222" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">what you rely on</text>
<path d="M144 294H606" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="144" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Name each one's source; check what can be checked.</text>
<text x="144" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">The danger is a false known. A contradicted one is marked ✗.</text>
<rect x="144" y="354" width="141" height="24" rx="12" fill="#F5DDD1"/>
<text x="214.5" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">KK · relying on</text>
<rect x="650" y="196" width="510" height="190" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="650" y="210" width="4" height="162" rx="2" fill="#B1ADA1"/>
<rect x="674" y="218" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="704" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UK</text>
<text x="752" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Unknown Knowns</text>
<text x="752" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">what you know but did not say</text>
<path d="M674 294H1136" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="674" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Guess it out loud, so you can react.</text>
<text x="674" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Taste, constraints, context: reacting costs less than specifying.</text>
<rect x="674" y="354" width="196" height="24" rx="12" fill="#F5DDD1"/>
<text x="772.0" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">UK · I assume you want</text>
<rect x="120" y="404" width="510" height="190" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/>
<rect x="120" y="418" width="4" height="162" rx="2" fill="#B1ADA1"/>
<rect x="144" y="426" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="174" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KU</text>
<text x="222" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Known Unknowns</text>
<text x="222" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">a question you can name</text>
<path d="M144 502H606" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/>
<text x="144" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Find it out, or ask with a recommended answer.</text>
<text x="144" y="553" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">Facts are the assistant's job. Only your decisions come to you.</text>
<rect x="144" y="562" width="94" height="24" rx="12" fill="#F5DDD1"/>
<text x="191.0" y="579" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">KU · open</text>
<rect x="650" y="404" width="510" height="190" rx="12" fill="#F5DDD1" stroke="#D97757" stroke-width="2.5" filter="url(#sh)"/>
<rect x="650" y="418" width="4" height="162" rx="2" fill="#D97757"/>
<rect x="674" y="426" width="60" height="60" rx="12" fill="#D97757"/>
<text x="704" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UU</text>
<text x="752" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Unknown Unknowns</text>
<text x="752" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">what you did not know to ask</text>
<path d="M674 502H1136" stroke="#D97757" stroke-width="1" stroke-opacity="0.6"/>
<text x="674" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C15F3C">→ Up to three things that matter, and why.</text>
<text x="674" y="553" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">“None found” is a valid answer. Nothing is manufactured.</text>
<rect x="674" y="562" width="305" height="24" rx="12" fill="#FAF9F5"/>
<text x="826.5" y="579" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">UU · you did not ask, but it matters</text>
<rect x="120" y="612" width="1040" height="62" rx="12" fill="#FFFFFF" stroke="#E3DFD3"/>
<rect x="120" y="624" width="4" height="38" rx="2" fill="#D97757"/>
<text x="144" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C">AFTER</text>
<text x="220" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#141413">fu:after · expected → found · now known · not proved · still unknown · decided for you</text>
<text x="1136" y="638" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59" text-anchor="end">no score, no file:</text>
<text x="1136" y="657" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#C15F3C" text-anchor="end">the map lives in the conversation</text>
</svg>
