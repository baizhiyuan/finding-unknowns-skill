<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#C15F3C" letter-spacing="1">// 03 · THE FOUR QUADRANTS</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#141413">Locate the gap before you pick a tool</text>
<text x="40" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5E5D59">Each kind of unknowing needs a different instrument. The ledger weights them unequally.</text>
<text x="375.0" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5">USER IS AWARE</text><text x="905.0" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5">USER IS NOT AWARE</text><text x="92" y="282.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5" transform="rotate(-90 92 282.0)">USER KNOWS</text><text x="92" y="466.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5E5D59" text-anchor="middle" letter-spacing="1.5" transform="rotate(-90 92 466.0)">USER DOESN'T KNOW</text><rect x="120" y="196" width="510" height="172" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/><rect x="120" y="210" width="4" height="144" rx="2" fill="#B1ADA1"/><rect x="144" y="218" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/><text x="174" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KK</text><text x="222" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Known Knowns</text><text x="222" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">in the prompt</text><text x="606" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">weight</text><text x="606" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.20</text><path d="M144 294H606" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/><text x="144" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Write them down.</text><text x="144" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59">implicit knowns drift if left unwritten</text><rect x="650" y="196" width="510" height="172" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/><rect x="650" y="210" width="4" height="144" rx="2" fill="#B1ADA1"/><rect x="674" y="218" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/><text x="704" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UK</text><text x="752" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Unknown Knowns</text><text x="752" y="266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">know-it-when-I-see-it taste</text><text x="1136" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">weight</text><text x="1136" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.25</text><path d="M674 294H1136" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/><text x="674" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Make tacit taste explicit.</text><rect x="674" y="332" width="118" height="26" rx="12" fill="#F5DDD1"/><text x="733.0" y="349.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T2 prototype</text><rect x="800" y="332" width="126" height="26" rx="12" fill="#F5DDD1"/><text x="863.0" y="349.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T4 references</text><rect x="120" y="380" width="510" height="172" rx="12" fill="#F0EEE6" stroke="#E3DFD3" stroke-width="1" filter="url(#sh)"/><rect x="120" y="394" width="4" height="144" rx="2" fill="#B1ADA1"/><rect x="144" y="402" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#B1ADA1" stroke-width="1.5"/><text x="174" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">KU</text><text x="222" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Known Unknowns</text><text x="222" y="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">nameable gaps</text><text x="606" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">weight</text><text x="606" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#141413" text-anchor="end">.25</text><path d="M144 478H606" stroke="#E3DFD3" stroke-width="1" stroke-opacity="0.6"/><text x="144" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141413">→ Ask targeted questions.</text><rect x="144" y="516" width="118" height="26" rx="12" fill="#F5DDD1"/><text x="203.0" y="533.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T3 interview</text><rect x="270" y="516" width="78" height="26" rx="12" fill="#F5DDD1"/><text x="309.0" y="533.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T5 plan</text><rect x="650" y="380" width="510" height="172" rx="12" fill="#F5DDD1" stroke="#D97757" stroke-width="2.5" filter="url(#sh)"/><rect x="650" y="394" width="4" height="144" rx="2" fill="#D97757"/><rect x="674" y="402" width="60" height="60" rx="12" fill="#D97757"/><text x="704" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#141413" text-anchor="middle">UU</text><text x="752" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#141413">Unknown Unknowns</text><text x="752" y="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5D59">blind spots</text><text x="1136" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5E5D59" text-anchor="end">weight</text><text x="1136" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#C15F3C" text-anchor="end">.30</text><path d="M674 478H1136" stroke="#D97757" stroke-width="1" stroke-opacity="0.6"/><text x="674" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C15F3C">→ Find what nobody thought to ask.</text><rect x="674" y="516" width="167" height="26" rx="12" fill="#FAF9F5"/><text x="757.5" y="533.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T1 blind-spot pass</text><rect x="849" y="516" width="78" height="26" rx="12" fill="#FAF9F5"/><text x="888.0" y="533.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#C15F3C" text-anchor="middle">T8 quiz</text><rect x="1026" y="516" width="110" height="26" rx="12" fill="#D97757"/><text x="1081.0" y="533.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">HEAVIEST</text><rect x="120" y="568" width="1040" height="58" rx="12" fill="#FFFFFF" stroke="#E3DFD3"/><rect x="120" y="578" width="4" height="38" rx="2" fill="#D97757"/><text x="144" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C15F3C" font-weight="700">FORMULA</text><text x="232" y="604" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413">ambiguity = 1 − (KK·.20 + KU·.25 + UK·.25 + <tspan fill="#C15F3C" font-weight="700">UU·.30</tspan>)</text><text x="1136" y="603" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5E5D59" text-anchor="end">scored per quadrant, every round</text></svg>
