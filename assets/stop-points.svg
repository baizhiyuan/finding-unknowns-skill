<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
<title id="t">Four stop-points</title>
<desc id="d">During the build the agent stops for you only on four conditions checked against the card; everything else is logged and work continues.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#B1ADA1" opacity="0.28"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C877A"/></marker>
</defs>
<rect width="1200" height="730" rx="18" fill="#FAF9F5" stroke="#E3DFD3"/>
<rect x="1" y="1" width="1198" height="728" rx="18" fill="url(#dots)"/>
<text x="60" y="64" font-size="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413" font-weight="700">Four stop-points</text>
<text x="60" y="100" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">Checked against the card, not left to the agent's sense of what is risky.</text>
<rect x="60" y="128" width="460" height="52" rx="10" fill="#F0EEE6" stroke="#B1ADA1" stroke-width="1.5"/>
<text x="80" y="160" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413" font-weight="600">Something comes up during the build</text>
<rect x="60" y="206" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="240" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#C15F3C" font-weight="700">1  Irreversible action?</text>
<text x="80" y="268" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">data rewritten or deleted, production, money, publishing, promises</text>
<path d="M522 249L596 249" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="240" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A" text-anchor="middle">yes</text>
<rect x="600" y="206" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="232" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Stop. The agent prepares the exact command;</text>
<text x="620" y="254" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">you run it or say yes to that one command;</text>
<text x="620" y="276" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">the post-check runs before the item closes.</text>
<rect x="60" y="306" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="340" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#C15F3C" font-weight="700">2  Scope change?</text>
<text x="80" y="368" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">outside the Brief's approach or contract</text>
<path d="M522 349L596 349" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="340" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A" text-anchor="middle">yes</text>
<rect x="600" y="306" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="354" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Stop. You decide whether the scope changes.</text>
<rect x="60" y="406" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="440" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#C15F3C" font-weight="700">3  A premise died, no reversible path left?</text>
<text x="80" y="468" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">a Brief premise or a prediction's falsifier fired</text>
<path d="M522 449L596 449" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="440" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A" text-anchor="middle">yes</text>
<rect x="600" y="406" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="443" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Stop. You confirm the Amendment;</text>
<text x="620" y="465" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">the original prediction is still graded.</text>
<rect x="60" y="506" width="460" height="86" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
<text x="80" y="540" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#C15F3C" font-weight="700">4  Over the agreed budget?</text>
<text x="80" y="568" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#3D3929">past the multiple agreed in the Brief</text>
<path d="M522 549L596 549" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="548" y="540" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A" text-anchor="middle">yes</text>
<rect x="600" y="506" width="540" height="86" rx="10" fill="#FBEFEA" stroke="#D97757" stroke-width="1.5"/>
<text x="620" y="554" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Stop. You decide: continue, cut back or re-brief.</text>
<path d="M290 592L290 626" stroke="#8C877A" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="304" y="614" font-size="14" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#8C877A">no to all four</text>
<rect x="60" y="630" width="1080" height="70" rx="10" fill="#EEF1E8" stroke="#788C5D" stroke-width="2"/>
<text x="80" y="660" font-size="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#5E7046" font-weight="700">Keep going.</text>
<text x="80" y="684" font-size="15" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#141413">Take the most reversible option and log one line on the card. Questions that can wait go to Open.</text>
</svg>
